<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="Styles/Login.css">
</head>
<body>
    <div class="iniciar">
        <h1>Iniciar Sesión</h1>
        <form>
            <div class="mail">
                <label>Correo Electrónico</label>
                <input type="email" id="correo" placeholder="Ej. rcux@gmail.com" required>
            </div>
            <div class="mail">
                <label>Contraseña</label>
                <input type="password" id="contrasena" placeholder="••••••••••••">
            </div>
            <ul><a href="">¿Olvidaste tu contraseña?</a></ul>
            <button>Entrar</button>
        </form>
    </div>
</body>
</html>
