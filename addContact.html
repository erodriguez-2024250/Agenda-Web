<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo contacto</title>
    <link rel="stylesheet" href="Styles/addContact.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <a href="contactos.html"><i class="fa-solid fa-house"></i>Inicio</a>
        <a href="ToDoList.html"><i class="fa-solid fa-list-check"></i>Pendientes</a>
        <a href="Favoritos.html "><i class="fa-solid fa-star"></i>Favoritos</a>

    </nav>
    
    <div class="formulario">
        <h1>Nuevo Contacto</h1>
        <form class="items">
            <div class="oh">
                <label>Nombres</label>
                <input type="text" placeholder="Ej. Roberto Andrés">
            </div>
            <div class="ah">
                <label>Apellidos</label>
                <input type="text" placeholder="Ej. Cux Chan">
            </div>
        
        <label>Número de teléfono</label>
        <input type="text" placeholder="Ej. 12345678">
        <label>Correo</label>
        <input type="email" placeholder="Ej. rcux@gmail.com">
        <button>Agregar<i class="fa-solid fa-person-circle-plus"></i></button>
        
        </form>
    </div>
    

</body>
</html>
